# Rime schema
# encoding: utf-8
#
# C双拼（cinput）
# 词库：白霜拼音 https://github.com/gaboolic/rime-frost

# 方案说明
schema:
  schema_id: cinput
  name: C双拼
  version: "1"
  description: |
    C双拼（cinput），词库取自白霜拼音。
  dependencies:
    - melt_eng        # 英文输入，作为次翻译器挂载到拼音方案


# 开关
# reset: 默认状态。注释掉后，切换窗口时不会重置到默认状态。
# states: 状态名称。
switches:
  - name: traditionalization
    states: [ 简体, 繁体 ]
  - name: full_shape
    states: [ 半角, 全角 ]

  - name: mars
    reset: 0
    states: [ 地, 煋 ] #火星文

  - name: pin_cand
    reset: 1
    states: [ 固顶关, 固顶开 ]


# 输入引擎
engine:
  processors:
    - lua_processor@*pin.processor      # Ctrl+P 置顶候选
    - lua_processor@*select_character   # 以词定字
    - ascii_composer
    - key_binder
    - speller
    - punctuator
    - selector
    - navigator
    - express_editor
  segmentors:
    - ascii_segmentor
    - matcher
    - abc_segmentor
    - punct_segmentor
    - fallback_segmentor
  translators:
    - punct_translator
    - lua_translator@*pin.translator    # 单字母时的置顶候选
    - script_translator
    - lua_translator@*date_translator   # 日期、时间、星期
    - table_translator@melt_eng         # 英文
    - lua_translator@*force_gc          # 暴力 GC
  filters:
    - lua_filter@*is_in_user_dict       # 用户词加 *
    - lua_filter@*corrector             # 错音错字提示
    - lua_filter@*reduce_english_filter # 英文短词降权
    - lua_filter@*pin.filter            # 置顶候选排到第一位
    - simplifier@traditionalize         # 简繁切换
    - simplifier@mars                   # 火星文
    - uniquifier                        # 去重

grammar:
  language: zh-moqi      # 语法模型；不配它 non_collocation_penalty 不生效
  non_collocation_penalty: -4


# Lua 配置：日期、时间、星期、ISO 8601、时间戳的触发关键字
date_translator:
  date: "rq`"           # 日期： 2022-11-29
  time: "sj`"           # 时间： 18:13
  week: "xq`"           # 星期： 星期二
  datetime: "dt`"       # ISO 8601： 2022-11-29T18:13:11+08:00
  timestamp: "ts`"      # 时间戳： 1669716794


# Lua 配置：为 corrector 格式化 comment，占位符为 {comment}
# 默认 "{comment}" 输入 hun dun 时会在「馄饨」旁边生成 hún tun 的 comment
# 例如左右加个括号 "({comment})" 就会变成 (hún tun)
corrector: "{comment}"


# Lua 配置：降低部分英文单词在候选里的位置（英文词常和拼音撞码，如 rug = 如果）
# mode：all 用内置词表 / custom 只用 words / none 关闭；idx 是降到第几位
# 详见 https://dvel.me/posts/make-rime-en-better/#短单词置顶的问题
reduce_english_filter:
  mode: custom  # all | custom | none
  idx: 2        # 降低到第 idx 个位置
  # 自定义的单词列表，示例列表没有降低部分常用单词，如 and cat mail Mac but bad shit ……
  words: [
    aid, ann,
    bail, bait, bam, band, bans, bat, bay, bend, bent, benz, bib, bid, bien, biz, boc, bop, bos, bud, buf, bach, bench, bush,
    cab, cad, cain, cam, cans, cap, cas, cef, chad, chan, chap, chef, cher, chew, chic, chin, chip, chit, coup, cum, cunt, cur, couch,
    dab, dag, dal, dam, dent, dew, dial, diet, dim, din, dip, dis, dit, doug, dub, dug, dunn,
    fab, fax, fob, fog, foul, fur,
    gag, gail, gain, gal, gam, gaol, ged, gel, ger, guam, gus, gut,
    hail, ham, hank, hans, hat, hay, heil, heir, hem, hep, hud, hum, hung, hunk, hut, hush,
    jim, jug,
    kat,
    lab, lad, lag, laid, lam, laos, lap, lat, lax, lay, led, leg, lex, liam, lib, lid, lied, lien, lies, linn, lip, lit, liz, lob, lug, lund, lung, lux, lash, loch, lush,
    mag, maid, mann, mar, mat, med, mel, mend, mens, ment, mil, mins, mint, mob, moc, mop, mos, mot, mud, mug, mum, mesh,
    nap, nat, nay, neil, nib, nip, noun, nous, nun, nut, nail, nash,
    pac, paid, pail, pain, pair, pak, pal, pam, pans, pant, pap, par, pat, paw, pax, pens, pic, pier, pies, pins, pint, pit, pix, pod, pop, pos, pot, pour, pow, pub, pinch, pouch,
    rand, rant, rent, rep, res, ret, rex, rib, rid, rig, rim, rub, rug, rum, runc, runs, ranch,
    sac, sail, sal, sam, sans, sap, saw, sax, sew, sham, shaw, shin, sig, sin, sip, sis, suit, sung, suns, sup, sur, sus,
    tad, tail, taj, tar, tax, tec, ted, tel, ter, tex, tic, tied, tier, ties, tim, tin, tit, tour, tout, tum,
    wag, wand, womens, wap, wax, weir, won,
    yan, yen,
    zach
  ]


# 置顶候选的默认表：输入单个字母时按这里的顺序出候选
# 格式：字母<TAB>词条1 词条2 ……
pin_cand_filter:
  - q	去 其实 岂不是
  - w	我 问题 为什么
  - e	而 而且 二维码
  - r	人 然后 如果
  - t	他 同时 特别是
  - y	有 已经 有没有
  - u	是 什么 是不是
  - i	出 差点 差不多
  - o	哦 偶尔 喔
  - p	配 平时 朋友圈
  - a	啊 爱好 按理说 阿
  - s	算 虽然 算不算
  - d	的 但是 的时候
  - f	非 发现 非常
  - g	个 感觉 怪不得
  - h	和 好的 会不会
  - j	就 觉得 基本上
  - k	可 可以 看起来
  - l	了 理解 了不起
  - z	在 自己 怎么样
  - x	小 现在 行不行
  - c	从 才能 猜不到
  - v	这 只是 之所以
  - b	吧 不是 不知道
  - n	你 那么 能不能
  - m	吗 没有 没什么


# 主翻译器，拼音
translator:
  grammar_penalty: -4
  max_homophones: 4
  max_homographs: 4
  max_sentences: 3
  dictionary: rime_frost       # 挂载词库 rime_frost.dict.yaml
  prism: cinput
  spelling_hints: 8            # 拼音写进 comment，供 corrector.lua 判断
  initial_quality: 1.2         # 权重比英文大
  comment_format:              # 拼音注释加［］，供 corrector.lua 识别
    - xform/^/［/
    - xform/$/］/


# 次翻译器，英文
melt_eng:
  dictionary: melt_eng         # 挂载词库 melt_eng.dict.yaml
  enable_sentence: false       # 禁止造句
  enable_user_dict: false      # 禁用用户词典
  initial_quality: 1.1         # 初始权重
  comment_format:              # 清空提示码
    - xform/.*//


# 简繁切换
traditionalize:
  option_name: traditionalization
  opencc_config: s2t.json
  tips: none                   # all 全显示 | char 仅单字 | none 不显示
  tags: [ abc, number ]        # 只转换拼音和数字


# 火星文切换
mars:
  opencc_config: martian.json
  option_name: mars


# 标点符号（表在同目录的 symbols.yaml）
punctuator:
  __include: symbols:/punctuator


# 快捷键（均只在输入中生效）
key_binder:
  select_first_character: "bracketleft"   # 以词定字：上屏首字 [
  select_last_character: "bracketright"   # 以词定字：上屏末字 ]
  bindings:
    - { when: composing, accept: Return, send: semicolon }
    - { when: composing, accept: Control+f, toggle: traditionalization }
    - { when: composing, accept: Control+comma, toggle: full_shape }
    - { when: composing, accept: Control+h, toggle: mars }
    - { when: composing, accept: Control+g, toggle: pin_cand }


# 拼写设定
speller:
  alphabet: "bpmfdtnlgkhjqxovuiarzcsywaoejbrm;;v"
  initials: "bpmfdtnlgkhjqxovuiarzcsywaoe"
  delimiter: " '"
  algebra:
    - erase/^xx$/
    # 以下硬编码由 C双拼音码.txt 统计得出（pinyin_shuangpin.tsv），现有规则无法产生的码在此补足。
    # 目标码用大写，避免被后续规则改写，末尾 xlit 统一转回小写。
